findings_summary:
  finding_1_incision_boundary_healing:
    concept: "Depth pruning creates localized boundary gaps, not global network degradation."
    actionable_peft: "Restricting trainable parameters to boundary layers (t=1..3 adjacent to dropped block) achieves 2.2x-4.0x higher PPL recovery with 33.3% fewer parameters."
    architectural_split: "Global attention (Mistral/Llama-3) plateaus at t=2; Sliding Window Attention (Gemma-2) requires t=3 due to SWA truncation bleed."
    references: "paper/main.tex, code/phases/phase15_layer_drop/"

  finding_2_bos_attention_sink_restoration:
    concept: "Mechanistic BOS attention sink restoration at the incision site."
    mechanism: "Layer-wise attention heatmaps prove boundary LoRA restores local BOS attention sink mass at the incision site without polluting unperturbed layers."
    references: "paper/figures/bos_attention_sink_comparison.png, code/phases/phase17_mechanistic/"

  finding_3_practitioner_caution_repetition_collapse:
    concept: "Perplexity is a necessary but non-sufficient metric for downstream reasoning readiness."
    repetition_collapse: "Qualitative generation analysis shows depth pruning induces repetition collapse on multi-step reasoning (GSM8K) that lightweight PEFT cannot fix, warning practitioners against evaluating depth-pruning via PPL alone."
    references: "paper/main.tex, scratch/inspect_generations.py"

